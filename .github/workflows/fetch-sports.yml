name: Atualizar Esportes Diariamente

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  sports:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install @anthropic-ai/sdk
      - name: Rodar bot de esportes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/fetch-sports.js
      - name: Commit e push
        run: |
          git config user.name "Miami Brasileiro Bot"
          git config user.email "bot@miamibrasileira.com"
          git add data/articles.json
          git diff --staged --quiet || git commit -m "bot: atualizar esportes $(date +%Y-%m-%d-%H%M)"
          git push
